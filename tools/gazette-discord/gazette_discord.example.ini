; Copie ce fichier en « gazette_discord.ini » (même dossier) et remplis-le.
[gazette]
; Dossier(s) du client, séparés par « ; » : celui qui contient WTF et Screenshots.
wow_dirs = C:\Program Files (x86)\World of Warcraft\_anniversary_

; Où ranger les PDF et images (un dossier par royaume et personnage). Par défaut : Documents\ForeverGazette
output_dir =

; Fabriquer le PDF et l'image PNG de chaque édition (nécessite Pillow : python -m pip install pillow)
pdf = yes
png = yes

; Discord (facultatif) : webhook du salon (Paramètres du salon > Intégrations > Webhooks > Nouveau webhook > Copier l'URL).
; Vide = fichiers seulement. Garde cette adresse pour toi : elle permet de poster dans le salon.
webhook =

; Ce qui part sur Discord : image (la page en image), pdf (le PDF), text (le texte Markdown), both (image + texte)
discord = image
; Joindre aussi le PDF au message image
discord_pdf = no

; Facultatif : seulement ces personnages (séparés par des virgules). Vide = tous.
characters =

; Nom affiché par Discord pour les messages.
username = ForeverGazette
