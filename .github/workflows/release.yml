name: Release

# Pousse un tag (ex. git tag v2.1.1 && git push origin v2.1.1) pour publier une version.
# Le tag porte la version de ForeverGFX ; ForeverMacros, ForeverGazette et ForeverPrep gardent celle de leur TOC.
# Archives : ForeverAddons-<tag>.zip (tous les addons, celle que prend WowUp grâce à release.json),
# plus un zip par addon pour une installation à la main.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Versions
        id: v
        run: |
          GFX="${GITHUB_REF_NAME#v}"
          sed -i "s/^## Version: .*/## Version: ${GFX}/" ForeverGFX/ForeverGFX.toc
          MACROS="$(sed -n 's/^## Version: *//p' ForeverMacros/ForeverMacros.toc | tr -d '\r')"
          echo "gfx=${GFX}" >> "$GITHUB_OUTPUT"
          echo "macros=${MACROS}" >> "$GITHUB_OUTPUT"
          GAZETTE="$(sed -n 's/^## Version: *//p' ForeverGazette/ForeverGazette.toc | tr -d '\r')"
          echo "gazette=${GAZETTE}" >> "$GITHUB_OUTPUT"
          PREP="$(sed -n 's/^## Version: *//p' ForeverPrep/ForeverPrep.toc | tr -d '\r')"
          echo "prep=${PREP}" >> "$GITHUB_OUTPUT"

      - name: Créer les archives
        run: |
          mkdir dist
          zip -r "dist/ForeverAddons-${GITHUB_REF_NAME}.zip" ForeverGFX ForeverMacros ForeverGazette ForeverPrep
          zip -r "dist/ForeverGFX-v${{ steps.v.outputs.gfx }}.zip" ForeverGFX
          zip -r "dist/ForeverMacros-v${{ steps.v.outputs.macros }}.zip" ForeverMacros
          zip -r "dist/ForeverGazette-v${{ steps.v.outputs.gazette }}.zip" ForeverGazette
          zip -r "dist/ForeverPrep-v${{ steps.v.outputs.prep }}.zip" ForeverPrep
          (cd tools && zip -r "../dist/ForeverGazette-Discord-v${{ steps.v.outputs.gazette }}.zip" gazette-discord)

      - name: Créer release.json (WowUp)
        run: |
          # Plus haute version d'interface du TOC par jeu : < 20000 Forever (type « forever » de WowUp), < 30000 TBC Anniversary, sinon retail.
          IFACES="$(sed -n 's/^## Interface: *//p' ForeverGFX/ForeverGFX.toc | tr -d ' \r' | tr ',' '\n')"
          top() { echo "$IFACES" | awk -v lo="$1" -v hi="$2" '$1 >= lo && $1 < hi' | sort -n | tail -1; }
          jq -n --arg name "ForeverAddons" --arg version "$GITHUB_REF_NAME" --arg file "ForeverAddons-${GITHUB_REF_NAME}.zip" \
            --argjson forever "$(top 10000 20000)" --argjson bcc "$(top 20000 30000)" --argjson mainline "$(top 100000 999999)" \
            '{releases: [{name: $name, version: $version, filename: $file, nolib: false, metadata: [
               {flavor: "mainline", interface: $mainline}, {flavor: "bcc", interface: $bcc}, {flavor: "forever", interface: $forever}]}]}' \
            > dist/release.json
          cat dist/release.json

      - name: Publier la version GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/release.json
          generate_release_notes: true
