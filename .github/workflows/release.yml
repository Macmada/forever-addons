name: Release

# Pousse un tag (ex. git tag v2.1.1 && git push origin v2.1.1) pour publier une version.
# Le tag porte la version de ForeverGFX ; les autres addons gardent celle de leur TOC.
# Archives : ForeverAddons-<tag>.zip (tous les addons, celle que prend WowUp grâce à release.json),
# plus un zip par addon pour une installation à la main.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Versions
        id: v
        run: |
          GFX="${GITHUB_REF_NAME#v}"
          sed -i "s/^## Version: .*/## Version: ${GFX}/" ForeverGFX/ForeverGFX.toc
          MACROS="$(sed -n 's/^## Version: *//p' ForeverMacros/ForeverMacros.toc | tr -d '\r')"
          echo "gfx=${GFX}" >> "$GITHUB_OUTPUT"
          echo "macros=${MACROS}" >> "$GITHUB_OUTPUT"
          COMPAGNON="$(sed -n 's/^## Version: *//p' ForeverCompagnon/ForeverCompagnon.toc | tr -d '\r')"
          echo "compagnon=${COMPAGNON}" >> "$GITHUB_OUTPUT"

      - name: Créer les archives
        run: |
          mkdir dist
          # ForeverHeal, ForeverLoot, ForeverPrep, ForeverMetiers : coquilles qui remplacent les anciens dossiers (fusionnés dans ForeverCompagnon)
          zip -r "dist/ForeverAddons-${GITHUB_REF_NAME}.zip" ForeverGFX ForeverMacros ForeverCompagnon ForeverPretre ForeverHeal ForeverLoot ForeverPrep ForeverMetiers
          zip -r "dist/ForeverGFX-v${{ steps.v.outputs.gfx }}.zip" ForeverGFX
          zip -r "dist/ForeverMacros-v${{ steps.v.outputs.macros }}.zip" ForeverMacros
          zip -r "dist/ForeverCompagnon-v${{ steps.v.outputs.compagnon }}.zip" ForeverCompagnon

      - name: Créer release.json (WowUp)
        run: |
          # WoW Forever seulement (type « forever » de WowUp) : plus haute version d'interface du TOC
          FOREVER="$(sed -n 's/^## Interface: *//p' ForeverGFX/ForeverGFX.toc | tr -d ' \r' | tr ',' '\n' | sort -n | tail -1)"
          jq -n --arg name "ForeverAddons" --arg version "$GITHUB_REF_NAME" --arg file "ForeverAddons-${GITHUB_REF_NAME}.zip" \
            --argjson forever "$FOREVER" \
            '{releases: [{name: $name, version: $version, filename: $file, nolib: false, metadata: [
               {flavor: "forever", interface: $forever}]}]}' \
            > dist/release.json
          cat dist/release.json

      - name: Notes de version (première section de CHANGELOG.md)
        run: |
          awk '/^## /{n++} n==1' CHANGELOG.md > dist/notes.md
          printf '\n---\nInstallation : WowUp, « Install from URL » avec https://github.com/Macmada/forever-addons\n' >> dist/notes.md
          cat dist/notes.md

      - name: Publier la version GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/release.json
          body_path: dist/notes.md
          generate_release_notes: false
