name: Lint

on:
  push:
  pull_request:

jobs:
  luacheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Luacheck
        uses: lunarmodules/luacheck@v1
        with:
          args: ForeverGFX ForeverMacros ForeverGazette ForeverCompagnon ForeverPretre ForeverHeal ForeverLoot ForeverPrep ForeverMetiers
      - name: Modules communs identiques dans chaque addon (diagnostic, icône, tutoriel)
        run: sh tools/sync-shared.sh --check
      - name: Caractères absents de la police du jeu (→ ≈ ✓ ● ○ ★ s'affichent en carré)
        run: "! grep -rn --include='*.lua' '[→≈✓●○★☆]' Forever* tools"
      - name: Fonctions absentes du client Forever ou interdites (relevé de forever-addon-kit)
        run: python3 tools/forever_api_check.py
      - name: Piège Lua « cond and nil or x » (vaut toujours x)
        run: "! grep -rn --include='*.lua' 'and nil or' Forever* tools"

  gazette-sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Simulations hors jeu des addons (fr et en)
        run: |
          sudo apt-get install -y -q lua5.1
          lua5.1 tests/gazette_sim.lua fr
          lua5.1 tests/gazette_sim.lua en
          lua5.1 tests/prep_sim.lua fr
          lua5.1 tests/prep_sim.lua en
          lua5.1 tests/heal_sim.lua fr
          lua5.1 tests/heal_sim.lua en
          lua5.1 tests/gfx_sim.lua fr
          lua5.1 tests/gfx_sim.lua en
          lua5.1 tests/macros_sim.lua fr
          lua5.1 tests/macros_sim.lua en
          lua5.1 tests/loot_sim.lua fr
          lua5.1 tests/loot_sim.lua en
          lua5.1 tests/metiers_sim.lua fr
          lua5.1 tests/metiers_sim.lua en
          lua5.1 tests/forbidden_sim.lua fr
          lua5.1 tests/forbidden_sim.lua en
          lua5.1 tests/compagnon_sim.lua fr
          lua5.1 tests/compagnon_sim.lua en
      - name: Compagnon Discord (syntaxe)
        run: python3 -m py_compile tools/gazette-discord/gazette_discord.py tools/gazette-discord/gazette_render.py
